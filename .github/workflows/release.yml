name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver, no leading v — e.g. 1.2.3).'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version input
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION' — must be semver (e.g. 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag is available
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin. Pick a higher version."
            exit 1
          fi

      - name: Sync package.json + manifests to target version
        env:
          TARGET: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const target = process.env.TARGET;
            const paths = [
              'package.json',
              'src/manifest/chrome.manifest.json',
              'src/manifest/firefox.manifest.json',
            ];
            for (const p of paths) {
              const json = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (json.version !== target) {
                json.version = target;
                fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
                console.log('Synced ' + p + ' -> ' + target);
              } else {
                console.log(p + ' already at ' + target);
              }
            }
          "

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm exec tsc -b

      - name: Test
        run: pnpm run test

      - name: Build Chrome
        run: pnpm run build:chrome

      - name: Build Firefox
        run: pnpm run build:firefox

      - name: Lint Firefox build
        run: pnpm exec web-ext lint --source-dir=dist/firefox

      - name: Package Chrome
        run: pnpm run package:chrome

      - name: Package Firefox
        run: pnpm run package:firefox

      - name: Rename Firefox artifact
        # web-ext names the output igdl-{version}.zip; standardise to igdl-firefox-{version}.zip
        run: mv "artifacts/igdl-${{ steps.version.outputs.version }}.zip" "artifacts/igdl-firefox-${{ steps.version.outputs.version }}.zip"

      - name: Commit version sync + tag
        env:
          TAG: v${{ steps.version.outputs.version }}
          TARGET: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json src/manifest/chrome.manifest.json src/manifest/firefox.manifest.json; then
            git add package.json src/manifest/chrome.manifest.json src/manifest/firefox.manifest.json
            git commit -m "chore: release $TARGET"
            git push origin "HEAD:$BRANCH"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/igdl-chrome-*.zip
            artifacts/igdl-firefox-*.zip
